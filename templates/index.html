<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Clínica Patas & Bigodes</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        :root {
            --verde-escuro: #005744;
            --verde: #4d8b7d;
            --verde-claro: #dceee7;
            --amarelo: #e4a52b;
            --branco: #ffffff;
        }

        body {
            margin: 0;
            background-color: var(--verde-claro);
            font-family: Georgia, 'Times New Roman', serif;
        }

        header {
            background-color: var(--verde-escuro);
            height: 70px;
        }

        .navbar {
            height: 100%;
        }

        .logo {
            width: 42px;
            height: 42px;
            background-color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
        }

        main {
            background-color: var(--verde-claro);
        }

        .inicio {
            min-height: 500px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 50px 40px;
        }

        .card-clinica {
            background-color: var(--verde);
            border: none;
            border-radius: 10px;
            width: 100%;
            max-width: 1000px;
            padding: 200px;
            color: black;
        }

        .titulo {
            font-size: 50px;
            font-weight: bold;
            line-height: 1.4;
        }

        .titulo span {
            color: var(--amarelo);
        }

        .opcoes {
            text-align: center;
        }

        .opcoes h6 {
            font-size: 25px;
            margin-bottom: 15px;
            line-height: 2.1;
        }

        .btn-clinica {
            background-color: var(--amarelo);
            border: none;
            color: #000;
            font-weight: bold;
            font-size: 17px;
            padding: 7px 25px;
            margin-bottom: 12px;
            border-radius: 4px;
            line-height: 1.7;
        }

        .btn-clinica:hover {
            background-color: #c88d16;
            color: white;
        }

        .localizacao {
            min-height: 600px;
            padding: 30px 30px;
            display: flex;
            align-items: center;
        }

        .mapa-container {
            position: relative;
            width: 400%;
            max-width: 500px;
            margin: auto;
        }

        .mapa {
            width: 100%;
            height: 300px;
            object-fit: cover;
            border-radius: 10px;
            display: block;
        }

        .endereco {
            background-color: var(--verde-escuro);
            color: white;
            border-radius: 18px;
            padding: 25px;
            max-width: 330px;
            margin: auto;
            text-align: center;
            border: 4px solid var(--verde-escuro);
        }

        .endereco h3 {
            color: var(--amarelo);
            font-size: 20px;
            margin-bottom: 15px;
        }

        .endereco p {
            font-size: 14px;
            line-height: 1.6;
            margin: 0;
        }

        footer {
            background-color: var(--verde-escuro);
            color: white;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px 30px;
            font-size: 11px;
        }

        .contatos {
            color: var(--amarelo);
            font-size: 16px;
        }

        @media (max-width: 768px) {

            .titulo {
                font-size: 30px;
                text-align: center;
                margin-bottom: 30px;
            }

            .mapa {
                height: 250px;
            }

            .endereco {
                margin-top: 40px;
            }

            footer {
                padding: 15px;
            }
        }

        .logo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 50%;
        }
    </style>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="icon" type="image/png" href="../static/img/logo.png">
</head>

<body>

    <header>
        <nav class="navbar">
            <div class="container-fluid">

                <a class="navbar-brand" href="#">
                    <div class="logo">
                        <img src="../static/img/logo.png" alt="Localização da Clínica Patas & Bigodes" class="mapa">
                    </div>
                </a>

            </div>
        </nav>
    </header>


    <main>

        <section class="inicio">

            <div class="card-clinica">

                <div class="row align-items-center">

                    <!-- TEXTO -->
                    <div class="col-md-7">

                        <h1 class="titulo">
                            Bem-vindos<br>
                            Clínica Patas <span>&</span><br>
                            <span>Bigodes</span>
                        </h1>

                    </div>


                    <div class="col-md-5">

                        <div class="opcoes">

                            <h6>Escolha uma opção:</h6>

                            <div>
                                <a href="cadastro.html" class="btn btn-clinica">
                                    Cadastrar
                                </a>
                            </div>

                            <div>
                                <a href="login.html" class="btn btn-clinica">
                                    Entrar
                                </a>
                            </div>

                        </div>

                    </div>

                </div>

            </div>

        </section>


        <section class="localizacao">

            <div class="container">

                <div class="row align-items-center">

                    <div class="col-md-7">

                        <div class="mapa-container">

                            <div class="detalhe-cima"></div>


                            <img src="../static/img/mapa.png" alt="Localização da Clínica Patas & Bigodes" class="mapa">

                        </div>

                    </div>


                    <div class="col-md-5">

                        <div class="endereco">

                            <h3>Estamos localizados em:</h3>

                            <p>
                                Rua das Flores, 123
                                <br>
                                Bairro Jardim
                                <br>
                                São Paulo - SP
                                <br><br>
                                CEP: 01234-567
                            </p>

                        </div>

                    </div>

                </div>

            </div>

        </section>

    </main>


    <footer>

        <div>
            Todos os direitos reservados
        </div>

        <div class="contatos">
            <i class="bi bi-instagram"></i>
            <i class="bi bi-facebook"></i>
        </div>

    </footer>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
    </script>

</body>

</html>
