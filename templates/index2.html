<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Patas & Bigodes</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #dcefeb;
            font-family: Arial, Helvetica, sans-serif;
        }

        /* Barra superior */

        header {
            width: 100%;
            height: 80px;
            background-color: #005c49;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 60px;
        }

        .logo {
            width: 42px;
            height: 42px;
            background-color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 30px;
            font-size: 17px;
        }

        nav a:hover {
            color: #edae35;
        }


        /* Conteúdo principal */

        main {
            display: flex;
            justify-content: center;
            align-items: center;

            min-height: calc(100vh - 80px);
        }


        /* Caixa principal */

        .hero {
            width: 1000px;
            min-height: 560px;

            background-color: #4f8f82;

            border-radius: 15px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 60px;

            position: relative;
            overflow: hidden;
        }


        /* Texto */

        .conteudo {
            width: 45%;
            z-index: 2;
        }

        .tagline {
            color: white;
            font-size: 16px;
            margin-bottom: 15px;
        }

        h1 {
            font-family: Georgia, serif;
            font-size: 55px;
            line-height: 1.05;

            color: #111;
        }

        h1 span {
            color: #edae35;
        }

        .descricao {
            margin-top: 20px;

            font-size: 17px;
            line-height: 1.5;

            color: #102b27;
        }


        /* Botões */

        .botoes {
            display: flex;
            gap: 15px;

            margin-top: 30px;
        }

        .btn {
            background-color: #edae35;

            padding: 13px 25px;

            border-radius: 7px;

            text-decoration: none;

            color: #111;

            font-weight: bold;

            transition: 0.3s;
        }

        .btn:hover {
            background-color: #f5c45c;
            transform: translateY(-2px);
        }


        /* Área dos animais */

        .animais {
            width: 50%;
            height: 100%;

            display: flex;
            justify-content: flex-end;
            align-items: flex-end;

            position: absolute;

            right: 0;
            bottom: 0;
        }

        .animais img {
            width: 520px;

            max-width: 100%;

            object-fit: contain;

            object-position: bottom;

            filter: drop-shadow(0px 10px 15px rgba(0,0,0,0.25));
        }


        /* Marca de pata no fundo */

        .pata-fundo {
            position: absolute;

            right: 80px;
            top: 50px;

            font-size: 230px;

            opacity: 0.07;

            color: black;

            transform: rotate(-15deg);
        }


        /* Responsividade */

        @media (max-width: 900px) {

            .hero {
                width: 90%;
                flex-direction: column;

                padding: 40px 30px 0;
            }

            .conteudo {
                width: 100%;
                text-align: center;
            }

            h1 {
                font-size: 42px;
            }

            .botoes {
                justify-content: center;
            }

            .animais {
                position: relative;

                width: 100%;

                justify-content: center;

                margin-top: 30px;
            }

            .animais img {
                width: 400px;
            }

        }

    </style>
</head>


<body>

<header>
    <nav>
        <div class="container-fluid">

                <a class="navbar-brand" href="#">
                    <div class="logo">
                        <img src="../static/img/logo.png" alt="Localização da Clínica Patas & Bigodes" class="mapa">
                    </div>
                </a>

            </div>
            <div class="logo">
        </div>
    </nav>
    
</header>


<main>

    <section class="hero">

        <!-- decoração -->
        <div class="pata-fundo">
            🐾
        </div>


        <!-- Texto -->

        <div class="conteudo">

            <p class="tagline">
                Cuidado, carinho e saúde para seu pet.
            </p>

            <h1>
                Bem-Vindo! <br>
                Clínica <br>
                Patas <span>&</span> <br>
                <span>Bigodes</span>
            </h1>

            <p class="descricao">
                Aqui você encontrará o melhor atendimento,
                cuidado e acolhimento para o seu pet.
            </p>


            <div class="botoes">

                <a href="#" class="btn">
                    Cadastrar
                </a>

                <a href="#" class="btn">
                    Entrar
                </a>

            </div>

        </div>


        <!-- Cachorro e gato -->

        <div class="animais">

            <img
                src="img/cachorro-gato.png"
                alt="Cachorro e gato da Clínica Patas e Bigodes"
            >

        </div>

    </section>

</main>

</body>
</html>
