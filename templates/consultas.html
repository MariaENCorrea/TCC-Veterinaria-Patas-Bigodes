<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #D7E9DE;
            font-family: Georgia, 'Times New Roman', serif;
            color: #034C3C;
        }

        .pagina {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* =========================
           HEADER
        ========================= */

        header {
            background-color: #034C3C;
        }

        .navbar-custom {
            height: 90px;
            display: flex;
            align-items: center;
        }

        .logo {
            width: 42px;
            height: 42px;
            background-color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
        }

        .btn-menu {
            color: #D7E9DE;
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
            margin-left: 25px;
            padding: 10px 20px;
            border-radius: 8px;
            transition: 0.3s;
        }

        .btn-menu:hover {
            background-color: #DE9E36;
            color: #034C3C;
        }

        .dog-img {
            width: 42px;
            height: 42px;
            background-color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
        }

        /* =========================
           MAIN
        ========================= */

        main {
            flex: 1;
        }

        /* TÍTULO */

        .titulo {
            text-align: center;
            margin-top: 60px;
            margin-bottom: 50px;
        }

        .titulo h1 {
            color: #034C3C;
            font-size: 42px;
            font-weight: bold;
        }

        .subtitulo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-top: 15px;
            color: #034C3C;
            font-size: 17px;
        }

        /* =========================
   FORMS AZUIS
========================= */

        .coluna {
            background-color: #c9e3f8;

            border-radius: 20px;

            padding: 100px;

            min-height: 300px;

            border: 1px solid #b5d5ee;

            margin-bottom: 70px;
        }

        /* Título de cada formulário */

        .titulo-coluna {
            text-align: center;

            font-size: 25px;

            font-weight: bold;

            margin-bottom: 20px;

            color: #111;

            margin-bottom: 40px;
        }

        .btn-confirmar {
            display: block;
            width: 300px;
            height: 40px;

            margin: 10px auto 0;

            background-color: var(--amarelo);
            border: 2px solid #222;
            border-radius: 5px;

            color: #111;
            font-size: 16px;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 30px;
        }

        .btn-confirmar:hover {
            background-color: #c98e18;
            color: white;
        }


        /* Labels */

        .form-label {
            display: block;

            font-size: 20px;

            font-weight: bold;

            margin-top: 15px;

            margin-bottom: 5px;
        }

        /* Campos */

        .form-control,
        .form-select {
            width: 100%;

            background-color: #4d8b7d;

            border: 1px solid #3b7669;

            border-radius: 5px;

            height: 32px;

            padding: 5px 8px;

            font-size: 20px;
        }

        .form-control:focus,
        .form-select:focus {
            background-color: #ffffff;

            border-color: #e4a52b;

            box-shadow: 0 0 0 2px rgba(228, 165, 43, 0.25);
        }

        footer {
            background-color: #034C3C;
            color: #D7E9DE;

            min-height: 80px;
            padding: 20px 40px;

            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .footer-icons {
            display: flex;
            gap: 20px;
            font-size: 24px;
        }

        .footer-icons i {
            color: #DE9E36;
            cursor: pointer;
            transition: 0.3s;
        }

        .footer-icons i:hover {
            color: #D7E9DE;
        }

        .opcoes .form-check-label {
            font-size: 20px;
            margin-left: 2px;
        }
        /* =========================
           RESPONSIVO
        ========================= */

        @media (max-width: 768px) {

            .navbar-custom {
                height: auto;
                padding: 15px 0;
            }

            .logo {
                width: 42px;
                height: 42px;
                background-color: white;
                border-radius: 50%;
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 22px;
            }

            .dog-img {
                width: 60px;
            }

            .btn-menu {
                font-size: 15px;
                margin-left: 5px;
                padding: 8px 10px;
            }

            .titulo {
                margin-top: 40px;
                margin-bottom: 30px;
            }

            .titulo h1 {
                font-size: 32px;
            }

            .subtitulo {
                font-size: 14px;
            }

            .linha {
                width: 50px;
            }

            .horario-card {
                min-height: 300px;
            }

            footer {
                padding: 15px;
            }
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }
    </style>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="icon" type="image/png" href="../img/favicon.png">
</head>

<body>


    <body>

        <header>

            <nav class="navbar-custom">

                <div class="container-fluid px-4 d-flex align-items-center justify-content-between">

                    <div class="logo">
                        <img src="../img/logo.png" alt="Logo" class="logo">
                    </div>

                    <div>
                        <a href="apresentacao.html" class="btn-menu">Início</a>
                        <a href="horários.html" class="btn-menu">Horários</a>
                    </div>

                    <a href="carterinha.html">
                        <img src="../img/cachorro.png" class="dog-img" alt="Cachorro">
                    </a>
                </div>

            </nav>

        </header>


        <main>
            <h1 titulo>Consulta</h1>

            <div class="row g-3">

                <!-- =====================
         FORMULÁRIO DO PET
    ====================== -->

                <div class="col-md-4">

                    <div class="coluna">

                        <h2 class="titulo-coluna">
                            Seu Pet
                        </h2>

                        <div class="d-flex justify-content-center gap-2 mb-3">

                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="sexo" id="macho" value="macho">

                                <label class="form-check-label" for="macho">
                                    Cachorro
                                </label>
                            </div>


                            <div class="form-check-label">

                                <input class="form-check-input" type="radio" name="sexo" id="femea" value="femea">

                                <label class="form-check-label" for="femea">
                                    Gato
                                </label>

                            </div>

                        </div>

                        <label for="nomePet" class="form-label">
                            Nome
                        </label>

                        <input type="text" id="nomePet" class="form-control" placeholder="Nome do pet">


                        <label for="raca" class="form-label">
                            Espécie/Raça
                        </label>

                        <input type="text" id="raca" class="form-control" placeholder="Ex: Golden Retriever">


                        <label for="idade" class="form-label">
                            Idade
                        </label>

                        <input type="number" id="idade" class="form-control" placeholder="Idade">

                    </div>

                </div>


                <!-- =====================
         FORMULÁRIO DO TUTOR
    ====================== -->

                <div class="col-md-4">

                    <div class="coluna">

                        <h2 class="titulo-coluna">
                            Dados do Tutor
                        </h2>


                        <label for="nomeTutor" class="form-label">
                            Nome
                        </label>

                        <input type="text" id="nomeTutor" class="form-control" placeholder="Nome completo">


                        <label for="celular" class="form-label">
                            Celular (WhatsApp)
                        </label>

                        <input type="tel" id="celular" class="form-control" placeholder="(00) 00000-0000">


                        <label for="email" class="form-label">
                            E-mail
                        </label>

                        <input type="email" id="email" class="form-control" placeholder="email@email.com">


                        <label for="informacoes" class="form-label">
                            Informações adicionais
                        </label>

                        <textarea id="informacoes" class="form-control" placeholder="Digite aqui..." rows="3">
            </textarea>

                    </div>

                </div>


                <!-- =====================
         FORMULÁRIO DO SERVIÇO
    ====================== -->

                <div class="col-md-4">

                    <div class="coluna">

                        <h2 class="titulo-coluna">
                            Selecione o serviço
                        </h2>


                        <label for="consulta" class="form-label">
                            Tipo de consulta
                        </label>

                        <select id="consulta" class="form-select">

                            <option selected>
                                Clínica Geral
                            </option>

                            <option>
                                Consulta de rotina
                            </option>

                            <option>
                                Vacinação
                            </option>

                            <option>
                                Retorno
                            </option>

                        </select>


                        <label for="especialidade" class="form-label">
                            Especialidade
                        </label>

                        <select id="especialidade" class="form-select">

                            <option selected>
                                Especialidade
                            </option>

                            <option>
                                Dermatologia
                            </option>

                            <option>
                                Cardiologia
                            </option>

                            <option>
                                Cirurgia
                            </option>

                        </select>

                    </div>

                </div>

            </div>
            <a href="login.html" type="button" class="btn btn-confirmar">
                Confirmar Consulta
            </a>

        </main>


        <footer>

            <div>
                Todos os direitos reservados
            </div>

            <div class="contatos">
                <i class="bi bi-instagram"></i>
                <i class="bi bi-facebook"></i>
            </div>

        </footer>

    </body>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
