<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro | Patas & Bigodes</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <link rel="icon" type="image/png" href="../static/img/favicon.png">

    <style>
        /* =====================================================
           CORES ORIGINAIS
        ===================================================== */

        :root {
            --verde-escuro: #005744;
            --verde: #4d8b7d;
            --verde-claro: #dceee7;
            --amarelo: #e4a52b;
            --branco: #ffffff;
            --preto: #000000;
        }


        /* =====================================================
           CONFIGURAÇÕES GERAIS
        ===================================================== */

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            background-color: var(--verde-claro);

            font-family: Georgia, "Times New Roman", serif;

            display: flex;
            flex-direction: column;
        }


        /* =====================================================
           HEADER
        ===================================================== */

        header {
            background-color: var(--verde-escuro);
            height: 80px;
        }

        .navbar {
            height: 100%;
        }

        .logo {
            width: 62px;
            height: 62px;
            background-color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
        }


        /* =====================================================
           BOTÃO VOLTAR
        ===================================================== */

        .btn-voltar {
            width: 43px;
            height: 43px;

            display: flex;
            align-items: center;
            justify-content: center;

            background-color: var(--amarelo);

            color: var(--preto);

            border-radius: 50%;

            text-decoration: none;

            font-size: 19px;

            transition: all 0.3s ease;
        }

        .btn-voltar:hover {
            background-color: #c98e18;

            color: var(--branco);

            transform: translateX(-3px);
        }


        /* =====================================================
           CONTEÚDO
        ===================================================== */

        main {
            flex: 1;

            padding: 45px 20px 55px;
        }


        /* =====================================================
           TÍTULO
        ===================================================== */

        .titulo {
            text-align: center;

            color: var(--verde-escuro);

            font-size: 42px;

            font-weight: bold;

            margin: 0;

            letter-spacing: 0.3px;
        }

        .linha-titulo {
            width: 55px;
            height: 4px;

            background-color: var(--amarelo);

            border-radius: 20px;

            margin: 12px auto 10px;
        }

        .subtitulo {
            text-align: center;

            color: var(--verde-escuro);

            font-size: 16px;

            margin: 0 auto 38px;

            opacity: 0.8;
        }


        /* =====================================================
           ÁREA DOS FORMULÁRIOS
        ===================================================== */

        .formularios {
            max-width: 1050px;

            margin: auto;

            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 30px;
        }


        /* =====================================================
           CARD
        ===================================================== */

        .formulario {
            background-color: var(--verde);

            border-radius: 20px;

            padding: 30px;

            box-shadow:
                0 10px 25px rgba(0, 0, 0, 0.12);

            border: 1px solid rgba(255, 255, 255, 0.15);

            position: relative;

            overflow: hidden;
        }


        /* detalhe superior do card */

        .formulario::before {
            content: "";

            position: absolute;

            top: 0;
            left: 0;

            width: 100%;
            height: 5px;

            background-color: var(--amarelo);
        }


        /* =====================================================
           CABEÇALHO DOS CARDS
        ===================================================== */

        .cabecalho-formulario {
            display: flex;

            align-items: center;

            gap: 14px;

            margin-bottom: 28px;

            padding-bottom: 18px;

            border-bottom: 1px solid rgba(255, 255, 255, 0.25);
        }

        .icone-formulario {
            width: 46px;
            height: 46px;

            display: flex;

            align-items: center;
            justify-content: center;

            background-color: var(--amarelo);

            color: var(--verde-escuro);

            border-radius: 12px;

            font-size: 22px;
        }

        .titulo-formulario {
            color: var(--branco);

            font-size: 23px;

            font-weight: bold;

            margin: 0;
        }

        .descricao-formulario {
            color: rgba(255, 255, 255, 0.8);

            font-family: Arial, sans-serif;

            font-size: 12px;

            margin: 3px 0 0;
        }


        /* =====================================================
           LABELS
        ===================================================== */

        .form-label {
            color: var(--amarelo);

            font-size: 16px;

            font-weight: bold;

            margin-bottom: 7px;
        }


        /* =====================================================
           INPUTS
        ===================================================== */

        .form-control,
        .form-select {

            height: 44px;

            background-color: var(--branco);

            border: 1px solid rgba(0, 0, 0, 0.35);

            border-radius: 9px;

            padding: 8px 13px;

            font-family: Arial, sans-serif;

            font-size: 14px;

            margin-bottom: 19px;

            transition: all 0.25s ease;
        }

        .form-control:hover,
        .form-select:hover {
            border-color: var(--amarelo);
        }

        .form-control:focus,
        .form-select:focus {

            border-color: var(--amarelo);

            box-shadow:
                0 0 0 3px rgba(228, 165, 43, 0.20);

            outline: none;
        }

        .form-control::placeholder {
            color: #8a8a8a;
        }


        /* =====================================================
           SEXO
        ===================================================== */

        .opcoes {

            display: flex;

            gap: 30px;

            margin-bottom: 20px;
        }

        .form-check {

            display: flex;

            align-items: center;

            gap: 7px;

            padding: 0;
        }

        .form-check-input {

            width: 17px;
            height: 17px;

            margin: 0;

            cursor: pointer;
        }

        .form-check-input:checked {

            background-color: var(--amarelo);

            border-color: var(--amarelo);
        }

        .form-check-label {

            color: var(--branco);

            font-family: Arial, sans-serif;

            font-size: 14px;

            cursor: pointer;
        }


        /* =====================================================
           BOTÃO CADASTRAR
        ===================================================== */

        .area-botao {

            display: flex;

            justify-content: center;

            margin-top: 35px;
        }

        .btn-cadastrar {

            min-width: 245px;

            height: 50px;

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 9px;

            background-color: var(--amarelo);

            color: var(--preto);

            border: none;

            border-radius: 10px;

            font-family: Arial, sans-serif;

            font-size: 15px;

            font-weight: bold;

            letter-spacing: 0.4px;

            text-decoration: none;

            box-shadow:
                0 5px 15px rgba(0, 0, 0, 0.15);

            transition: all 0.3s ease;
        }

        .btn-cadastrar:hover {

            background-color: #c98e18;

            color: var(--branco);

            transform: translateY(-2px);

            box-shadow:
                0 8px 18px rgba(0, 0, 0, 0.18);
        }


        /* =====================================================
           FOOTER
        ===================================================== */

        footer {

            min-height: 50px;

            background-color: var(--verde-escuro);

            color: var(--branco);

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 0 30px;

            font-family: Arial, sans-serif;

            font-size: 12px;
        }

        .contatos {

            display: flex;

            align-items: center;

            gap: 15px;

            color: var(--amarelo);

            font-size: 18px;
        }

        .contatos i {

            cursor: pointer;

            transition: 0.3s;
        }

        .contatos i:hover {

            color: var(--branco);

            transform: translateY(-2px);
        }


        /* =====================================================
           RESPONSIVIDADE
        ===================================================== */

        @media (max-width: 850px) {

            .formularios {

                grid-template-columns: 1fr;

                max-width: 650px;
            }
        }


        @media (max-width: 576px) {

            .logo img {
                width: 100%;
                height: 100%;
                object-fit: contain;
                border-radius: 50%;
            }

            header {
                height: 68px;
            }

            .logo {
                width: 44px;
                height: 44px;
            }

            main {
                padding: 30px 15px 40px;
            }

            .titulo {
                font-size: 32px;
            }

            .subtitulo {
                font-size: 14px;

                margin-bottom: 28px;
            }

            .formulario {
                padding: 23px 20px;

                border-radius: 16px;
            }

            .titulo-formulario {
                font-size: 20px;
            }

            .descricao-formulario {
                font-size: 11px;
            }

            .btn-cadastrar {
                width: 100%;
            }

            footer {
                padding: 0 18px;
            }
        }
    </style>

</head>


<body>


    <!-- =====================================================
         CABEÇALHO
    ===================================================== -->

    <header>

        <nav class="navbar">

            <div class="container-fluid px-4">

                <a href="index.html">

                    <img src="../static/img/logo.png" alt="Patas & Bigodes" class="logo">

                </a>


                <a href="index.html" class="btn-voltar" title="Voltar">

                    <i class="bi bi-arrow-left"></i>

                </a>

            </div>

        </nav>

    </header>



    <!-- =====================================================
         CONTEÚDO PRINCIPAL
    ===================================================== -->

    <main>


        <h1 class="titulo">
            Cadastre-se
        </h1>


        <div class="linha-titulo"></div>


        <p class="subtitulo">
            Crie seu cadastro e mantenha as informações do seu pet organizadas.
        </p>



        <div class="formularios">


            <!-- =================================================
                 FORMULÁRIO DO ANIMAL
            ================================================= -->

            <form class="formulario">


                <div class="cabecalho-formulario">

                    <div class="icone-formulario">

                        <i class="bi bi-heart-pulse-fill"></i>

                    </div>


                    <div>

                        <h2 class="titulo-formulario">
                            Dados do Animal
                        </h2>

                        <p class="descricao-formulario">
                            Informe os dados do seu pet
                        </p>

                    </div>

                </div>



                <!-- NOME -->

                <label for="nomeAnimal" class="form-label">
                    Nome do Animal
                </label>

                <input type="text" class="form-control" id="nomeAnimal" placeholder="Digite o nome do animal" required>



                <!-- SEXO -->

                <label class="form-label">
                    Sexo
                </label>


                <div class="opcoes">

                    <div class="form-check">

                        <input class="form-check-input" type="radio" name="sexo" id="macho" value="macho">

                        <label class="form-check-label" for="macho">
                            Macho
                        </label>

                    </div>


                    <div class="form-check">

                        <input class="form-check-input" type="radio" name="sexo" id="femea" value="femea">

                        <label class="form-check-label" for="femea">
                            Fêmea
                        </label>

                    </div>

                </div>



                <!-- IDADE -->

                <label for="idade" class="form-label">
                    Idade
                </label>

                <input type="number" class="form-control" id="idade" placeholder="Digite a idade" min="0">



                <!-- ESPÉCIE -->

                <label for="especie" class="form-label">
                    Espécie
                </label>

                <select class="form-select" id="especie">

                    <option selected disabled>
                        Selecione a espécie
                    </option>

                    <option>
                        Cachorro
                    </option>

                    <option>
                        Gato
                    </option>

                    <option>
                        Ave
                    </option>

                    <option>
                        Outro
                    </option>

                </select>



                <!-- RAÇA -->

                <label for="raca" class="form-label">
                    Raça
                </label>

                <input type="text" class="form-control" id="raca" placeholder="Digite a raça">

            </form>



            <!-- =================================================
                 FORMULÁRIO DO PROPRIETÁRIO
            ================================================= -->

            <form class="formulario">


                <div class="cabecalho-formulario">

                    <div class="icone-formulario">

                        <i class="bi bi-person-fill"></i>

                    </div>


                    <div>

                        <h2 class="titulo-formulario">
                            Dados do Proprietário
                        </h2>

                        <p class="descricao-formulario">
                            Informe seus dados pessoais
                        </p>

                    </div>

                </div>



                <!-- NOME -->

                <label for="proprietario" class="form-label">
                    Nome Completo
                </label>

                <input type="text" class="form-control" id="proprietario" placeholder="Digite seu nome completo"
                    required>



                <!-- CPF -->

                <label for="cpf" class="form-label">
                    CPF
                </label>

                <input type="text" class="form-control" id="cpf" placeholder="000.000.000-00">


                <label for="cpf" class="form-label">
                    RG do Proprietário
                </label>

                <input type="text" class="form-control" id="rg" placeholder="RG">


                <label for="cpf" class="form-label">
                    Número de Celular
                </label>

                <input type="tel" class="form-control" id="numero" placeholder="(00) 00000-0000">



                <!-- EMAIL -->

                <label for="email" class="form-label">
                    E-mail
                </label>

                <input type="email" class="form-control" id="email" placeholder="exemplo@email.com">



                <!-- CIDADE -->

                <label for="cidade" class="form-label">
                    Cidade
                </label>

                <input type="text" class="form-control" id="cidade" placeholder="Digite sua cidade">



                <!-- BAIRRO -->

                <label for="bairro" class="form-label">
                    Bairro
                </label>

                <input type="text" class="form-control" id="bairro" placeholder="Digite seu bairro">

            </form>

        </div>



        <!-- =====================================================
             BOTÃO
        ===================================================== -->

        <div class="area-botao">

            <a href="login.html" class="btn-cadastrar">

                <i class="bi bi-check2-circle"></i>

                Finalizar Cadastro

            </a>

        </div>


    </main>



    <!-- =====================================================
         RODAPÉ
    ===================================================== -->

    <footer>

        <span>
            © 2026 Patas & Bigodes
        </span>


        <span class="contatos">

            <i class="bi bi-instagram"></i>

            <i class="bi bi-facebook"></i>

        </span>

    </footer>



    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
    </script>

</body>

</html>
