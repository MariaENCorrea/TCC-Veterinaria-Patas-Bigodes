<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Patas & Bigodes</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="../static/css/login.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="icon" type="image/png" href="../static/img/favicon.png">
</head>

<body>

    <header>

        <nav class="navbar">

            <div class="container-fluid px-4">

                <img src="../static/img/logo.png" alt="Patas & Bigodes" class="logo">


                <a href="index.html" class="btn-voltar" title="Voltar">

                    <i class="bi bi-arrow-left"></i>

                </a>

            </div>

        </nav>

    </header>


    <main>

        <section class="inicio">

            <div class="card-clinica">

                <!-- ÍCONE -->

                <div class="login-icon">
                    <i class="bi bi-person-heart"></i>
                </div>


                <!-- TÍTULO -->

                <h1 class="titulosegundario">
                    Bem-vindo à Patas & Bigodes!
                </h1>

                <p class="login-descricao">
                    Faça seu login para acessar sua conta e
                    acompanhar os cuidados do seu pet.
                </p>


                <!-- FORMULÁRIO -->

                <form class="formulario">

                    <label for="nomeUsuario" class="form-label">
                        Nome de usuário
                    </label>

                    <input type="text" class="form-control" id="nomeUsuario" placeholder="Digite seu nome de usuário"
                        required>


                    <label for="senha" class="form-label">
                        Senha
                    </label>

                    <input type="password" class="form-control" id="senha" placeholder="Digite sua senha" required>


                    <a href="apresentacao.html" class="btn-login">

                        <i class="bi bi-box-arrow-in-right"></i>
                        Entrar

                    </a>

                </form>

            </div>

        </section>

    </main>

    
    <footer>

        <div class="footer-content">

            <div class="footer-logo">

                <img src="../static/img/logo.png" alt="Patas & Bigodes">

                <div>

                    <strong>Patas & Bigodes</strong>

                    <span>
                        Cuidado que vira carinho.
                    </span>

                </div>

            </div>


            <div class="footer-social">

                <a href="https://www.instagram.com/" target="_blank" aria-label="Instagram">

                    <i class="bi bi-instagram"></i>

                </a>

                <a href="https://www.facebook.com/" target="_blank" aria-label="Facebook">

                    <i class="bi bi-facebook"></i>

                </a>

            </div>


            <p>
                © 2026 Patas & Bigodes. Todos os direitos reservados.
            </p>

        </div>

    </footer>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
    </script>

</body>

</html>
