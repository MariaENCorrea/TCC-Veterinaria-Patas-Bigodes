<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Horários - Patas & Bigodes</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">


    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #D7E9DE;
            font-family: Georgia, 'Times New Roman', serif;
            color: #034C3C;
        }

        .pagina {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* =========================
           HEADER
        ========================= */

        header {
            background-color: #034C3C;
        }

        .navbar-custom {
            height: 90px;
            display: flex;
            align-items: center;
        }

        .logo {
            width: 42px;
            height: 42px;
            background-color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
        }

        .btn-menu {
            color: #D7E9DE;
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
            margin-left: 25px;
            padding: 10px 20px;
            border-radius: 8px;
            transition: 0.3s;
        }

        .btn-menu:hover {
            background-color: #DE9E36;
            color: #034C3C;
        }

        .dog-img {
            width: 42px;
            height: 42px;
            background-color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
        }

        /* =========================
           MAIN
        ========================= */

        main {
            flex: 1;
        }

        /* TÍTULO */

        .titulo {
            text-align: center;
            margin-top: 60px;
            margin-bottom: 50px;
        }

        .titulo h1 {
            color: #034C3C;
            font-size: 42px;
            font-weight: bold;
        }

        .subtitulo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-top: 15px;
            color: #034C3C;
            font-size: 17px;
        }

        .linha {
            width: 100px;
            height: 3px;
            background-color: #DE9E36;
            border-radius: 5px;
        }

        /* =========================
           CARDS
        ========================= */

        .cards-container {
            margin-bottom: 70px;
        }

        .horario-card {
            background-color: #034C3C;
            color: #D7E9DE;
            border-radius: 20px;
            padding: 35px 25px;
            text-align: center;
            min-height: 350px;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            box-shadow: 0 8px 20px rgba(3, 76, 60, 0.20);
            transition: 0.3s;
        }

        .horario-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 25px rgba(3, 76, 60, 0.30);
        }

        /* ÍCONES */

        .icone {
            font-size: 55px;
            color: #DE9E36;
            margin-bottom: 20px;
        }

        /* DIAS */

        .dia {
            display: inline-block;
            font-size: 25px;
            background-color: #DE9E36;
            color: #034C3C;
            font-weight: bold;
            text-transform: capitalize;
            padding: 8px 18px;
            border-radius: 10px;
        }

        /* LINHAS */

        .linha-branca {
            width: 80%;
            height: 2px;
            background-color: #D7E9DE;
            margin: 20px 0;
            opacity: 0.7;
        }

        /* HORÁRIOS */

        .hora {
            font-size: 28px;
            font-weight: bold;
            color: #DE9E36;
        }

        .fechado {
            font-size: 28px;
            font-weight: bold;
            color: #DE9E36;
        }

        .texto-card {
            font-size: 16px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #D7E9DE;
        }

        /* =========================
           FOOTER
        ========================= */

        footer {
            background-color: #034C3C;
            color: #D7E9DE;

            min-height: 80px;
            padding: 20px 40px;

            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .footer-icons {
            display: flex;
            gap: 20px;
            font-size: 24px;
        }

        .footer-icons i {
            color: #DE9E36;
            cursor: pointer;
            transition: 0.3s;
        }

        .footer-icons i:hover {
            color: #D7E9DE;
        }

        /* =========================
           RESPONSIVO
        ========================= */

        @media (max-width: 768px) {

            .navbar-custom {
                height: auto;
                padding: 15px 0;
            }

            .logo {
                width: 42px;
                height: 42px;
                background-color: white;
                border-radius: 50%;
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 22px;
            }

            .dog-img {
                width: 60px;
            }

            .btn-menu {
                font-size: 15px;
                margin-left: 5px;
                padding: 8px 10px;
            }

            .titulo {
                margin-top: 40px;
                margin-bottom: 30px;
            }

            .titulo h1 {
                font-size: 32px;
            }

            .subtitulo {
                font-size: 14px;
            }

            .linha {
                width: 50px;
            }

            .horario-card {
                min-height: 300px;
            }

            footer {
                padding: 15px;
            }
        }
    </style>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="icon" type="image/png" href="../img/favicon.png">
</head>

<body>

    <div class="pagina">

        <!-- =========================
             HEADER
        ========================= -->

        <header>

            <nav class="navbar-custom">

                <div class="container-fluid px-4 d-flex align-items-center justify-content-between">

                    <div class="logo">
                        <img src="../img/logo.png" alt="Logo" class="logo">
                    </div>

                    <div>
                        <a href="apresentacao.html" class="btn-menu">Início</a>
                        <a href="consultas.html" class="btn-menu">Consulta</a>
                    </div>

                    <a href="carterinha.html">
                        <img src="../img/cachorro.png" class="dog-img" alt="Cachorro">
                    </a>
                </div>

            </nav>

        </header>


        <!-- =========================
             MAIN
        ========================= -->

        <main>

            <div class="container">

                <!-- TÍTULO -->

                <section class="titulo">

                    <h1>Nossos Horários</h1>

                    <div class="subtitulo">

                        <div class="linha"></div>

                        <span>
                            Confira nossos horários de atendimento
                        </span>

                        <div class="linha"></div>

                    </div>

                </section>


                <!-- HORÁRIOS -->

                <section class="row justify-content-center g-5 cards-container">

                    <!-- SEGUNDA A SEXTA -->

                    <div class="col-12 col-md-4">

                        <div class="horario-card">

                            <i class="bi bi-calendar-week icone"></i>

                            <div>
                                <span class="dia">
                                    Seg a sexta
                                </span>
                            </div>

                            <div class="linha-branca"></div>

                            <div class="hora">
                                09:00 - 20:00
                            </div>

                            <div class="linha-branca"></div>

                            <span class="texto-card">
                                Horários
                            </span>

                        </div>

                    </div>


                    <!-- SÁBADO -->

                    <div class="col-12 col-md-4">

                        <div class="horario-card">

                            <i class="bi bi-calendar-week icone"></i>

                            <div>
                                <span class="dia">
                                    Sábado
                                </span>
                            </div>

                            <div class="linha-branca"></div>

                            <div class="hora">
                                09:00 - 13:00
                            </div>

                            <div class="linha-branca"></div>

                            <span class="texto-card">
                                Horários
                            </span>

                        </div>

                    </div>


                    <!-- DOMINGO -->

                    <div class="col-12 col-md-4">

                        <div class="horario-card">

                            <i class="bi bi-lock icone"></i>

                            <div>
                                <span class="dia">
                                    Domingo
                                </span>
                            </div>

                            <div class="linha-branca"></div>

                            <div class="fechado">
                                Fechado
                            </div>

                            <div class="linha-branca"></div>

                            <span class="texto-card">
                                Não abrimos
                            </span>

                        </div>

                    </div>

                </section>

            </div>

        </main>


        <!-- =========================
             FOOTER
        ========================= -->

        <footer>

            <div>
                Todos os direitos reservados
            </div>

            <div class="contatos">
                <i class="bi bi-instagram"></i>
                <i class="bi bi-facebook"></i>
            </div>

        </footer>


        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
        </script>
    </div>

</body>

</html>
